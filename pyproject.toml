[project]
name = "hello-web"
version = "0.1.0"
description = "A minimal FastAPI hello world web app"
authors = [
    { name = "norbeey@gmail.com", email = "norbeey@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "httpx>=0.28.1",
]

[project.scripts]
hello-web = "hello_web:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
